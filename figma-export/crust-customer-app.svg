<svg width="390" height="844" viewBox="0 0 390 844" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .font-sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .font-serif { font-family: 'Fraunces', Georgia, serif; }
      .font-mono { font-family: 'JetBrains Mono', monospace; }
    </style>
    <filter id="mobileCardShadow" x="-10" y="-5" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Base Burgundy -->
  <rect width="390" height="844" fill="#2A0E0A" rx="40" />

  <!-- iOS Status Bar -->
  <g id="iOS-Status-Bar">
    <text x="32" y="34" class="font-sans" font-size="14" font-weight="600" fill="#F7E6D4">9:41</text>
    <circle cx="330" cy="30" r="3" fill="#F7E6D4" />
    <circle cx="340" cy="30" r="4" fill="#F7E6D4" />
    <rect x="352" y="24" width="20" height="11" rx="3" stroke="#F7E6D4" stroke-width="1.5" />
    <rect x="354" y="26" width="12" height="7" rx="1.5" fill="#F7E6D4" />
  </g>

  <!-- Top App Navigation -->
  <g id="App-Nav">
    <text x="24" y="80" class="font-serif" font-size="24" font-weight="700" fill="#F7E6D4" letter-spacing="1">CRUST</text>
    <text x="106" y="80" class="font-mono" font-size="10" font-weight="700" fill="#E77A53">WOOD HEARTH</text>

    <!-- Cart Pill -->
    <rect x="256" y="60" width="110" height="32" rx="16" fill="#3D150F" stroke="#5A2218" stroke-width="1" />
    <text x="311" y="80" class="font-sans" font-size="11" font-weight="700" fill="#E77A53" text-anchor="middle">🛒 2 items ($38)</text>
  </g>

  <!-- Hero Promo Card -->
  <g id="Hero-Promo" filter="url(#mobileCardShadow)">
    <rect x="20" y="106" width="350" height="136" rx="14" fill="#3D150F" stroke="#5A2218" stroke-width="1" />
    <text x="36" y="138" class="font-mono" font-size="10" font-weight="700" fill="#E77A53">72-HOUR SOURDOUGH FERMENTATION</text>
    <text x="36" y="166" class="font-serif" font-size="18" font-weight="700" fill="#F7E6D4">Stone-Fired Pizza</text>
    <text x="36" y="190" class="font-sans" font-size="11" font-weight="400" fill="#D1A99A">Naturally leavened dough blistered at 900°F in our stone oven.</text>

    <rect x="36" y="206" width="80" height="22" rx="4" fill="#BF4226" />
    <text x="76" y="221" class="font-sans" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">Order Now</text>
  </g>

  <!-- Category Filter Chips -->
  <g id="Category-Chips">
    <!-- Chip 1 (Selected) -->
    <rect x="20" y="258" width="80" height="32" rx="16" fill="#BF4226" />
    <text x="60" y="278" class="font-sans" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">🍕 Pizza</text>

    <!-- Chip 2 -->
    <rect x="108" y="258" width="90" height="32" rx="16" fill="#3D150F" stroke="#5A2218" stroke-width="1" />
    <text x="153" y="278" class="font-sans" font-size="12" font-weight="500" fill="#D1A99A" text-anchor="middle">Antipasti</text>

    <!-- Chip 3 -->
    <rect x="206" y="258" width="76" height="32" rx="16" fill="#3D150F" stroke="#5A2218" stroke-width="1" />
    <text x="244" y="278" class="font-sans" font-size="12" font-weight="500" fill="#D1A99A" text-anchor="middle">Dolci</text>

    <!-- Chip 4 -->
    <rect x="290" y="258" width="80" height="32" rx="16" fill="#3D150F" stroke="#5A2218" stroke-width="1" />
    <text x="330" y="278" class="font-sans" font-size="12" font-weight="500" fill="#D1A99A" text-anchor="middle">Wines</text>
  </g>

  <!-- ======================================================== -->
  <!-- FOOD ITEMS LIST -->
  <!-- ======================================================== -->
  <g id="Food-Items">
    <!-- Item 1: Tartufo -->
    <g id="Item-Tartufo">
      <rect x="20" y="306" width="350" height="110" rx="14" fill="#36130E" stroke="#4F1B12" stroke-width="1" />
      
      <!-- Placeholder thumbnail box -->
      <rect x="32" y="318" width="84" height="84" rx="10" fill="#4A1913" />
      <text x="74" y="365" class="font-sans" font-size="28" text-anchor="middle">🍄</text>

      <!-- Details -->
      <text x="128" y="338" class="font-sans" font-size="14" font-weight="700" fill="#F7E6D4">Tartufo &amp; Wild Funghi</text>
      <text x="128" y="356" class="font-sans" font-size="10" font-weight="400" fill="#BFA095">Cremini, fior di latte, black truffle,</text>
      <text x="128" y="370" class="font-sans" font-size="10" font-weight="400" fill="#BFA095">fresh mountain thyme.</text>

      <text x="128" y="394" class="font-mono" font-size="13" font-weight="800" fill="#E77A53">$22.00</text>

      <!-- Add Button -->
      <rect x="304" y="374" width="54" height="28" rx="6" fill="#BF4226" />
      <text x="331" y="392" class="font-sans" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">+ Add</text>
    </g>

    <!-- Item 2: Diavola -->
    <g id="Item-Diavola">
      <rect x="20" y="428" width="350" height="110" rx="14" fill="#36130E" stroke="#4F1B12" stroke-width="1" />
      
      <rect x="32" y="440" width="84" height="84" rx="10" fill="#4A1913" />
      <text x="74" y="487" class="font-sans" font-size="28" text-anchor="middle">🌶️</text>

      <text x="128" y="460" class="font-sans" font-size="14" font-weight="700" fill="#F7E6D4">Calabrian Diavola</text>
      <text x="128" y="478" class="font-sans" font-size="10" font-weight="400" fill="#BFA095">Spicy salami, San Marzano tomato,</text>
      <text x="128" y="492" class="font-sans" font-size="10" font-weight="400" fill="#BFA095">hot honey drizzle, basil.</text>

      <text x="128" y="516" class="font-mono" font-size="13" font-weight="800" fill="#E77A53">$20.50</text>

      <rect x="304" y="496" width="54" height="28" rx="6" fill="#BF4226" />
      <text x="331" y="514" class="font-sans" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">+ Add</text>
    </g>

    <!-- Item 3: Burrata Pugliese -->
    <g id="Item-Burrata">
      <rect x="20" y="550" width="350" height="110" rx="14" fill="#36130E" stroke="#4F1B12" stroke-width="1" />
      
      <rect x="32" y="562" width="84" height="84" rx="10" fill="#4A1913" />
      <text x="74" y="609" class="font-sans" font-size="28" text-anchor="middle">🧀</text>

      <text x="128" y="582" class="font-sans" font-size="14" font-weight="700" fill="#F7E6D4">Burrata Pugliese</text>
      <text x="128" y="600" class="font-sans" font-size="10" font-weight="400" fill="#BFA095">Heirloom cherry tomatoes, aged balsamic,</text>
      <text x="128" y="614" class="font-sans" font-size="10" font-weight="400" fill="#BFA095">warm sea salt focaccia.</text>

      <text x="128" y="638" class="font-mono" font-size="13" font-weight="800" fill="#E77A53">$15.00</text>

      <rect x="304" y="618" width="54" height="28" rx="6" fill="#BF4226" />
      <text x="331" y="636" class="font-sans" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">+ Add</text>
    </g>
  </g>

  <!-- ======================================================== -->
  <!-- FLOATING CART / CHECKOUT BAR -->
  <!-- ======================================================== -->
  <g id="Floating-Cart" filter="url(#mobileCardShadow)">
    <rect x="20" y="756" width="350" height="56" rx="16" fill="#BF4226" />
    <text x="44" y="790" class="font-sans" font-size="13" font-weight="700" fill="#FFFFFF">View Cart (2 Items)</text>
    <text x="346" y="790" class="font-sans" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="end">$38.00 ➔</text>
  </g>
</svg>
